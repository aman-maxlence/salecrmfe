version: '3.8'

services:
  sale_crm_fe:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5175:5175'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5175']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
